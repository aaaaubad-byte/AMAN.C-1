<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8fa"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icons/icon-512-v3.png"><link rel="apple-touch-icon" href="./icons/apple-touch-icon-v3.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="إدارة أمان"><title>أمان | الإدارة</title><style>.brand picture,.login-brand picture{display:block;flex:0 0 auto}.brand-logo{display:block;height:36px;width:auto}.login-brand .login-logo{display:block;width:auto;height:72px;margin:0 auto 12px;border-radius:0;background:none}</style><script src="../services/theme.js"></script><link rel="stylesheet" href="../styles/app.css"><link rel="stylesheet" href="./login.css"><script defer src="../services/runtime.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.0/dist/umd/supabase.js" crossorigin="anonymous"></script><script defer src="../services/supabase-config.js"></script><script defer src="../services/supabase-adapter.js"></script><script defer src="../services/pull-to-refresh.js"></script><script defer src="./app.js"></script><script defer src="../services/compact-filters.js"></script><script defer src="./phase3-a5-a8.js"></script><script defer src="./phase3-a9-a12.js"></script><script defer src="./phase3-a13-a17.js"></script><script defer src="./phase4-a18-a25.js"></script><script defer src="./phase5-a26-a31.js"></script><script defer src="./pwa.js"></script></head>
<body><main class="app admin-app">
<header class="topbar admin-topbar"><button class="icon-btn" id="admin-account" aria-label="الحساب"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button><strong class="admin-topbar-greeting">مرحبًا بك</strong></header>

<section id="admin-login" class="login-screen"><div class="login-wrap">
<div class="login-brand"><picture><source data-theme-dark-logo media="(prefers-color-scheme: dark)" srcset="../assets/brand/logo-mark-light-v2.png"><img class="login-logo" src="../assets/brand/logo-mark-v2.png" alt="شعار أمان" width="85" height="72"></picture><h1>تطبيق الإدارة</h1></div>
<div class="login-card"><h2>تسجيل دخول</h2>
<form id="admin-login-form" class="login-form">
<div class="login-field"><label class="field-label" for="admin-username">البريد الإلكتروني</label><input class="field login-input-ltr" id="admin-username" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
<div class="login-field"><label class="field-label" for="admin-password">كلمة المرور</label><div class="password-wrap"><input class="field login-input-ltr" id="admin-password" type="password" autocomplete="current-password" required><button class="password-toggle" id="admin-password-toggle" type="button" aria-label="إظهار كلمة المرور" aria-pressed="false"><svg class="aman-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M4 4l16 16"/></svg></button></div></div>
<label class="remember-row" for="admin-remember"><input type="checkbox" id="admin-remember"><span>تذكرني</span></label>
<p class="notice-error" id="admin-login-message" aria-live="polite"></p>
<button class="btn btn-block login-submit" type="submit">دخول</button>
</form></div>
</div></section>

<section id="dashboard-screen" hidden>
<div class="admin-stats">
<article class="stat-card"><span class="stat-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></span><small>طلبات قيد المراجعة</small><strong id="stat-pending-requests">—</strong></article>
<article class="stat-card"><span class="stat-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18"><rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M9 6h6"/><path d="M9 10h2m3 0h1"/><path d="M9 14h2m3 0h1m-5 4h2"/></svg></span><small>الأرقام المحمية</small><strong id="stat-protected-numbers">—</strong></article>
<article class="stat-card"><span class="stat-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18"><path d="M4 22V4"/><path d="M4 4h14l-2 4 2 4H4"/></svg></span><small>البلاغات المفتوحة</small><strong id="stat-open-reports">—</strong></article>
<article class="stat-card"><span class="stat-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><small>مهام السداد</small><strong id="stat-due-tasks">—</strong></article>
<article class="stat-card"><span class="stat-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8m2 3a6 6 0 0 1 3 6"/></svg></span><small>العملاء</small><strong id="stat-customers">—</strong></article>
<article class="stat-card"><span class="stat-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></span><small>الإيرادات المعتمدة</small><strong id="stat-revenue">—</strong></article>
</div>
<div class="section-head"><h2><span class="admin-section-icon" aria-hidden="true"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>الأقسام</h2></div>
<div class="admin-shortcuts">
<button class="admin-shortcut" data-section="requests"><span class="quick-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></span><strong>الطلبات</strong></button>
<button class="admin-shortcut" data-section="numbers"><span class="quick-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M9 6h6"/><path d="M9 10h2m3 0h1"/><path d="M9 14h2m3 0h1m-5 4h2"/></svg></span><strong>الأرقام</strong></button>
<button class="admin-shortcut" data-section="customers"><span class="quick-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8m2 3a6 6 0 0 1 3 6"/></svg></span><strong>العملاء</strong></button>
<button class="admin-shortcut" id="shortcut-followup" data-section="followup" type="button"><span class="quick-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg></span><strong>نافذة الظهور والمتابعة</strong></button>
<button class="admin-shortcut" data-section="tasks"><span class="quick-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><strong>المهام</strong></button>
<button class="admin-shortcut" data-section="complaints"><span class="quick-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4"/><path d="M4 4h14l-2 4 2 4H4"/></svg></span><strong>البلاغات</strong></button>
<button class="admin-shortcut" data-section="reports"><span class="quick-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l3 3v15H4V3z"/><path d="M8 10h8"/><path d="M8 14h8"/><path d="M8 18h5"/></svg></span><strong>التقارير</strong></button>
<button class="admin-shortcut" data-section="notifications"><span class="quick-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span><strong>الإشعارات</strong></button>
<button class="admin-shortcut" data-section="alerts"><span class="quick-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4"/><path d="M4 4h14l-2 4 2 4H4"/></svg></span><strong>تنبيهات الأرقام</strong></button>
<button class="admin-shortcut" data-section="settings"><span class="quick-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10"/><path d="M18 6h2"/><path d="M4 12h2"/><path d="M10 12h10"/><path d="M4 18h12"/><path d="M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></span><strong>الشركات والإعدادات</strong></button>
</div>
<section class="surface" style="margin-top:17px"><div class="section-head" style="margin:0 0 10px"><h2><span class="admin-section-icon" aria-hidden="true"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span>النشاطات</h2></div><div class="empty-state"><strong>لا توجد نشاطات مسجلة</strong><p>تظهر هنا أحدث النشاطات.</p></div></section>
</section>

<section id="admin-section" hidden>
<header class="page-head screen-head"><button class="tile-btn" type="button" id="admin-back" aria-label="رجوع"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button><div class="screen-head-title"><h1 class="page-title" id="section-title">الطلبات</h1><p class="screen-subtitle" id="section-description"></p></div><span class="screen-head-spacer" aria-hidden="true"></span></header>
<div id="requests-list-view" hidden>
<div class="surface">
<div class="admin-filter-grid">
<div class="toolbar-search"><label class="field-label" for="request-search">بحث</label><div class="toolbar-search-control"><input class="field" id="request-search" placeholder="رقم الطلب أو الهاتف أو العميل"><button class="icon-btn toolbar-clear requests-reset-icon" id="requests-reset" type="button" aria-label="مسح البحث والتصفية" title="مسح التصفية" hidden><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6m4-6v6"/><path d="M6 7l1 14h10l1-14"/><path d="M9 7V4h6v3"/></svg></button></div></div>
<div><label class="field-label" for="request-status">حالة الطلب</label><select class="field" id="request-status"><option value="pending">قيد المراجعة</option><option value="all">كل الحالات</option><option value="approved">معتمد</option><option value="rejected">مرفوض</option></select></div>
<div><label class="field-label" for="request-type">نوع العملية</label><select class="field" id="request-type"><option value="all">كل العمليات</option><option value="subscription">اشتراك</option><option value="extension">تمديد الاشتراك</option><option value="reactivation">تنشيط</option></select></div>
<div><label class="field-label" for="request-company">الشركة</label><select class="field" id="request-company"><option value="all">كل الشركات</option></select></div>
</div>
</div>
<div id="requests-list" aria-live="polite"><div class="surface empty-state"><strong>سجّل الدخول لعرض الطلبات</strong></div></div>
</div>
<div id="request-detail-view" hidden>
<div class="field-row detail-toolbar"><button class="btn btn-outline" id="request-detail-back" type="button">الطلبات</button></div>
<div id="request-detail-content"></div>
</div>
<div id="admin-generic-view" class="surface" hidden><div class="empty-state"><div class="empty-icon" id="section-icon"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></div><strong id="section-empty-title">لا توجد بيانات لعرضها</strong><p id="section-empty-description"></p></div></div>
</section>
</main>
<nav class="bottom-nav" id="admin-bottom-nav" aria-label="تنقل الإدارة" hidden><button class="nav-item active" data-admin-tab="dashboard"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>الرئيسية</span></button><button class="nav-item" data-admin-tab="requests"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l3 3v15H4V3z"/><path d="M8 10h8"/><path d="M8 14h8"/><path d="M8 18h5"/></svg><span>الطلبات</span></button><button class="nav-item" data-admin-tab="numbers"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6"/><path d="M9 11h2m3 0h1"/><path d="M9 15h2m3 0h1"/></svg><span>الأرقام</span></button><button class="nav-item" data-admin-tab="customers"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8m2 3a6 6 0 0 1 3 6"/></svg><span>العملاء</span></button><button class="nav-item" data-admin-tab="more"><svg class="aman-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>المزيد</span></button></nav>
</body></html>
